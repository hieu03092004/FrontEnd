    <!-- end JSON object -->
    <div class="listUser" id="listUser"></div>
    <script>
        //JSON kieu number
        // let jsonNumber = `5`;
        // console.log(jsonNumber);
        // console.log(JSON.parse(jsonNumber));
        // end JSON kieu number
        // JSON co gia tri la array
        let jsonArray =
            `
        [
            {
                "id":1,
                "name":"Le Van A",
                "email":"levana@gmail.com"
            },
             {
                "id":2,
                "name":"Le Van B",
                "email":"levanb@gmail.com"
            },
             {
                "id":3,
                "name":"Le Van C",
                "email":"levanc@gmail.com"
            }

        ]
        `;
        let listUser = JSON.parse(jsonArray);
        let htmls = "";
        listUser.forEach(item => {
            htmls += `
            <div class="user-item">
                <div class="inner-name">${item.name}</div>
                 <div class="inner-name">${item.email}</div>
            </div>
            `
        });
        const divListUser = document.querySelector("#listUser");
        divListUser.innerHTML = htmls;
        console.log(htmls);
        //end JSON array 
    </script>
