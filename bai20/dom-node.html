<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <div id="ads"></div> -->
    <ul id="menu">
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>
    <button id="buttonAdd">Thêm mới</button>
    <script>
        // them moi item cho menu
        const menu = document.querySelector("#menu");
        const buttonAdd = document.querySelector("#buttonAdd");
        buttonAdd.onclick = function () {
            const firstElement = menu.firstElementChild;
            const newItem = document.createElement("li");
            newItem.innerHTML = "Item mới";
            menu.insertBefore(newItem, firstElement);
            // menu.appendChild(newItem);
        }
        const listItem = menu.querySelectorAll("li");
        listItem.forEach(item => {
            item.onclick = function () {
                const newItem = document.createElement("li");
                newItem.innerHTML = "Item mới";
                menu.replaceChild(newItem, item);
                //(item ms,vitri thay the)
            }
        });
        //End them moi item cho menu
        // const div = document.createElement("div");

        // console.log(div);
        // setInterval(() => {

        //     divads.appendChild(div);
        // }, 3000);
    </script>
</body>

</html>
