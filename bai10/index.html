<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css" />

    <title>Hello, world!</title>
</head>

<body>
    <!-- Registration Form Section -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Register Form</h2>
                        <p class="mb-0">Please fill out the registration form</p>
                    </div>
                    <div class="card-body">
                        <!-- Progress Bar -->
                        <div class="progress mb-4">
                            <div class="progress-bar" role="progressbar" style="width: 50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                                Step 1 of 2
                            </div>
                        </div>

                        <form id="registrationForm" method="post" action="/register-form">
                            <!-- Step 1 -->
                            <div id="step1" class="form-step">
                                <div class="form-group mb-3">
                                    <label class="form-label">Would you like to sign up for Stratus Account? <span class="text-danger">*</span></label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="stratus_account" id="stratus_yes" value="Yes" required>
                                        <label class="form-check-label" for="stratus_yes">Yes</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="stratus_account" id="stratus_no" value="No" required>
                                        <label class="form-check-label" for="stratus_no">No</label>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <button type="button" class="btn btn-primary" onclick="nextStep()">Next</button>
                                </div>
                            </div>

                            <!-- Step 2 -->
                            <div id="step2" class="form-step" style="display: none;">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group mb-3">
                                            <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group mb-3">
                                            <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>

                                <div class="form-group mb-3">
                                    <label for="phone" class="form-label">Phone <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="phone" name="phone" required>
                                </div>

                                <div class="form-group mb-3">
                                    <label class="form-label">What types of forms have you created? <span class="text-danger">*</span></label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="payment_form" value="Payment Form">
                                        <label class="form-check-label" for="payment_form">Payment Form</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="survey_form" value="Survey Form">
                                        <label class="form-check-label" for="survey_form">Survey Form</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="donation_form" value="Donation Form">
                                        <label class="form-check-label" for="donation_form">Donation Form</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="contact_form" value="Contact Form">
                                        <label class="form-check-label" for="contact_form">Contact Form</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="quote_form" value="Request a Quote Form">
                                        <label class="form-check-label" for="quote_form">Request a Quote Form</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="form_types[]" id="event_form" value="Event Registration Form">
                                        <label class="form-check-label" for="event_form">Event Registration Form</label>
                                    </div>
                                </div>

                                <div class="form-group mb-3">
                                    <label class="form-label">What payment method(s) do you use? <span class="text-danger">*</span></label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="payment_methods[]" id="paypal" value="Paypal">
                                        <label class="form-check-label" for="paypal">Paypal</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="payment_methods[]" id="stripe" value="Stripe">
                                        <label class="form-check-label" for="stripe">Stripe</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="payment_methods[]" id="mollie" value="Mollie">
                                        <label class="form-check-label" for="mollie">Mollie</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="payment_methods[]" id="other_payment" value="Other">
                                        <label class="form-check-label" for="other_payment">Other</label>
                                    </div>
                                </div>

                                <div class="form-group mb-3">
                                    <label for="specify_other" class="form-label">Please Specify (if Other)</label>
                                    <input type="text" class="form-control" id="specify_other" name="specify_other">
                                </div>

                                <div class="form-group mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="privacy_policy" name="privacy_policy" value="1" required>
                                        <label class="form-check-label" for="privacy_policy">
                                            I agree to the privacy policy. <span class="text-danger">*</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="text-center">
                                    <button type="button" class="btn btn-secondary me-2" onclick="previousStep()">Previous</button>
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function nextStep() {
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const progressBar = document.querySelector('.progress-bar');
            
            // Validate step 1
            const stratusAccount = document.querySelector('input[name="stratus_account"]:checked');
            if (!stratusAccount) {
                alert('Please select an option for Stratus Account');
                return;
            }
            
            step1.style.display = 'none';
            step2.style.display = 'block';
            progressBar.style.width = '100%';
            progressBar.textContent = 'Step 2 of 2';
        }
        
        function previousStep() {
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const progressBar = document.querySelector('.progress-bar');
            
            step2.style.display = 'none';
            step1.style.display = 'block';
            progressBar.style.width = '50%';
            progressBar.textContent = 'Step 1 of 2';
        }
    </script>
    <style>
        .section-two .inner-main {
            border-radius: 10px;
            overflow: hidden;
        }

        .section-two .inner-head {
            background: -webkit-linear-gradient(-30deg, #f57f20, #d62b08 100%);
            text-align: center;
            padding: 10px;
        }

        .section-two .inner-head .inner-title {
            color: #fff;
            font-weight: 700;
            font-size: 32px;
        }

        .section-two .inner-body {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 0 0 10px 10px;
        }

        .section-two .inner-head .inner-desc {
            color: #fff;
        }

        .button {
            background: -webkit-linear-gradient(-30deg, #f57f20, #d62b08 100%);
            border: 0;
            padding: 10px 30px;
            color: #fff;
            font-weight: 600;
            border-radius: 45px;
        }
    </style>
    <div class="section-two">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="inner-main">
                        <div class="inner-head">
                            <h2 class="inner-title">Tiêu đề form</h2>
                            <p class="inner-desc">Mô tả form</p>
                        </div>
                        <div class="inner-body">
                            <form action="">
                                <div class="row">
                                    <div class="col-xl-6">
                                        <div class="form-group">
                                            <input type="text" class="form-control" placeholder="Họ và tên*" />
                                        </div>
                                    </div>
                                    <div class="col-xl-6">
                                        <div class="form-group">
                                            <input type="text" class="form-control" placeholder="Số điện thoại*" />
                                        </div>
                                    </div>
                                    <div class="col-xl-12">
                                        <div class="form-group">
                                            <textarea class="form-control" placeholder="Nội dung"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-xl-12 text-center">
                                        <button class="button">Gửi ngay</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
        Launch demo modal
    </button>

    <!-- Modal -->
    <style>
        .modal-form .modal-header {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .modal-form .modal-header .close {
            position: absolute;
            top: 4px;
            right: 8px;
            background: black;
            opacity: 1;
            border-radius: 50%;
            color: #fff;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-form .modal-header .inner-image {
            height: 40px;
            width: auto;
            margin-bottom: 10px;
        }

        .modal-form .modal-header .inner-title {
            font-size: 32px;
            font-weight: 600;
        }

        .modal-form .modal-header .inner-desc {
            margin-bottom: 0;
        }

        .modal-form .button {
            width: 100%;
        }

        .modal-form .modal-content {
            border-radius: 12px;
        }
    </style>
    <div class="modal fade modal-form" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <img class="inner-image" src="https://cdn.daca.vn/media/logo/logo.svg" alt="Logo" />
                    <h5 class="inner-title">Liên hệ với chúng tôi</h5>
                    <p class="inner-desc">Lorem</p>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form action="">
                        <div class="row">
                            <div class="col-12">
                                <div class="form-group">
                                    <input type="text" class="form-control" placeholder="Họ và tên" />
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <input type="text" class="form-control" placeholder="Số điện thoại" />
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <input type="text" class="form-control" placeholder="Lĩnh vực kinh doanh" />
                                </div>
                            </div>
                            <div class="col-12">
                                <button class="button">Gửi đi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- end Modal -->
    <style>
        @media (min-width: 1200px) {
            .col-xl-20 {
                flex: 0 0 20%;
                max-width: 20%;
            }
        }

        .col-xl-20 {
            position: relative;
            padding-left: 15px;
            padding-right: 15px;
            width: 100%;
        }
    </style>

    <!-- Tabs Products -->
    <div class="section-three">
        <div class="container">
            <div class="inner-head">
                <h2 class="inner-title">Thảm tấm đế cao su</h2>
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="home-tab" data-toggle="tab" data-target="#home"
                            type="button" role="tab" aria-controls="home" aria-selected="true">
                            <h3>Sản phẩm mới</h3>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="profile-tab" data-toggle="tab" data-target="#profile" type="button"
                            role="tab" aria-controls="profile" aria-selected="false">
                            <h3>Sản phẩm nổi bật</h3>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="contact-tab" data-toggle="tab" data-target="#contact" type="button"
                            role="tab" aria-controls="contact" aria-selected="false">
                            <h3>Khuyến mãi</h3>
                        </button>
                    </li>
                </ul>
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                        <div class="products">
                            <div class="row">
                                <div class="col-xl-20">
                                    <div class="product-item">Ảnh tiêu đề Giá</div>
                                </div>
                                <div class="col-xl-20">
                                    <div class="product-item">Ảnh tiêu đề Giá</div>
                                </div>
                                <div class="col-xl-20">
                                    <div class="product-item">Ảnh tiêu đề Giá</div>
                                </div>
                                <div class="col-xl-20">
                                    <div class="product-item">Ảnh tiêu đề Giá</div>
                                </div>
                                <div class="col-xl-20">
                                    <div class="product-item">Ảnh tiêu đề Giá</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="profile" role="" aria-labelledby="profile-tab">
                        Sản phẩm nổi bật
                    </div>
                    <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                        Khuyến mãi
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- end Tabs Products -->

    <script src="assets/bootstrap/jquery.slim.min.js"></script>
    <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
</body>

</html>
